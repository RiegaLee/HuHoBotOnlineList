# 图片左上角显示的服务器名称；默认不重复使用 HuHoBot 品牌名。
server-name: "MinecraftServer"

# 同一个群连续请求的最短间隔，防止多人反复触发图片生成。
cooldown-seconds: 3

messages:
  busy: "在线列表正在生成，请稍候再试。"
  failed: "在线列表生成或发送失败，请稍后再试。"
  page-usage: "用法：/{command} [页码]，页码必须是正整数。"
  page-out-of-range: "没有第 {page} 页，当前共 {pages} 页。"

pagination:
  # 三列布局推荐每页 27 人（3 列 × 9 行），单页图片为 1200×1920。
  page-size: 27

sorting:
  # 管理员置顶；管理员组和普通玩家组内均按玩家名排序。
  admin-first: true
  admin-permission: "huhobotonlinelist.priority"

render:
  # 新版透明材质主题默认使用三列紧凑玩家卡片。
  columns: 3
  font-family: ""
  footer-text: "POWERED BY HuHoBot"
  # 可选的用户底图。PNG 放入：
  # plugins/HuHoBotOnlineList/assets/custom/backgrounds/
  # 新版透明材质 UI 始终启用；这里仅控制是否尝试加载外部 PNG。
  # 文件不存在时会安全回退到新版内置默认底图，不会再显示旧版机器人主题。
  custom-background:
    enabled: true
    file: online-list.png
    # cover 保持比例并居中裁切；stretch 拉伸到完整动态画布。
    fit: cover
    # 浅烟灰卡片的透明度。推荐 0.08-0.16；数值越低，底图透出越明显。
    surface-opacity: 0.12
    # 仅在底图过亮、白字难以辨认时，自适应轻度压暗整张底图；不会加深卡片。
    adaptive-backdrop-dimming: true
    maximum-backdrop-dimming: 0.38

test:
  # 大于 0 时，QQ群 /在线列表 会改用指定数量的虚假玩家，可测试完整 QQ 发图链路。
  # 正式使用时务必保持 0。允许范围：0-300。
  fake-player-count: 0
  # 支持 {index}、{index2}、{index3}，并允许故意超过正常 Minecraft ID 长度来测试省略效果。
  fake-player-name-template: "TestPlayer{index3}"
  # 虚假名单中前几名标记为管理员，便于检查置顶排序和 ADMIN 标识。
  fake-admin-count: 3

skin:
  enabled: true
  # 开启后会在控制台记录头像来自 Bukkit、SkinsRestorer、历史缓存还是 Steve 兜底。
  debug: false
  # 保存每名玩家最后一次成功头像，Profile 临时不可用或重启后仍可继续显示。
  persistent-cache: true
  # steve：使用 JAR 内置的 Steve 正脸；initial：使用旧版彩色首字母头像。
  fallback-avatar: "steve"
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  cache-size: 200
  download-threads: 4
  skins-restorer:
    enabled: true
    # 已绑定皮肤不存在时，允许异步查询 SkinsRestorer 将在玩家登录时应用的皮肤。
    allow-lookup: true

image-api:
  # QQ 官方机器人图片上限高于此值；这里预留余量并提前给出清晰错误。
  max-bytes: 20971520
